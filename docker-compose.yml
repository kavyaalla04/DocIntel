version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0-alpine
    container_name: doc-intel-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: document-intelligence
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - doc-intel-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: doc-intel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doc-intel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-intel-backend
    ports:
      - "3000:3000"
    environment:
      APP_NAME: "Document Intelligence Platform"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "3000"
      MONGODB_URL: "mongodb://admin:admin123@mongodb:27017"
      MONGODB_DB: "document-intelligence"
      REDIS_URL: "redis://redis:6379"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://keygateway1.arshnivlabs.com/v1}
      FRONTEND_URL: "http://localhost:5173"
      LOG_LEVEL: "INFO"
      JWT_SECRET: "change-this-in-production"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./main.py:/app/main.py
    networks:
      - doc-intel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn main:app --host 0.0.0.0 --port 3000 --reload

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc-intel-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3000"
      VITE_API_PROXY_TARGET: "http://backend:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - doc-intel-network
    command: npm run dev -- --host 0.0.0.0

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: doc-intel-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - doc-intel-network

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  doc-intel-network:
    driver: bridge
